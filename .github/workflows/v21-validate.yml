name: V21 validation

on:
  push:
    branches:
      - v21-design-coherence
      - v20-visual-system
      - main
  pull_request:
    branches:
      - v20-visual-system
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build static review output
        run: npm run build

      - name: Verify committed production output matches source
        run: git diff --exit-code -- docs index.html .nojekyll

      - name: Run model and controller tests
        run: npm test

      - name: Run route and semantic structure checks
        run: node scripts/check.mjs --html-snapshots /tmp/clm-hub-html.json

      - name: Run generated HTML audit
        run: python3 scripts/check-html.py /tmp/clm-hub-html.json

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run desktop browser and reading-continuity checks
        env:
          HUB_BASE_URL: http://127.0.0.1:8000/CLM-AI-Knowledge-hub/docs
          HUB_ENTRY_URL: http://127.0.0.1:8000/CLM-AI-Knowledge-hub/
        run: |
          mkdir -p /tmp/clm-pages-preview/CLM-AI-Knowledge-hub
          cp -R docs index.html .nojekyll /tmp/clm-pages-preview/CLM-AI-Knowledge-hub/
          python3 -m http.server 8000 --directory /tmp/clm-pages-preview >/tmp/clm-hub-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/browser-smoke.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-browser-qa
          path: reports/browser-v21
          if-no-files-found: warn
