name: V22 prototype validation

on:
  push:
    branches:
      - v22-visual-ambition
    paths:
      - 'prototypes/v22-visual-ambition/**'
      - '.github/workflows/v22-prototype-validate.yml'
  pull_request:
    branches:
      - v21-design-coherence
    paths:
      - 'prototypes/v22-visual-ambition/**'
      - '.github/workflows/v22-prototype-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Static prototype checks
        shell: bash
        run: |
          set -euo pipefail
          test -s prototypes/v22-visual-ambition/index.html
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          path = Path('prototypes/v22-visual-ambition/index.html')
          text = path.read_text(encoding='utf-8')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
                  self.buttons=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d:
                      self.ids.append(d['id'])
                  if tag == 'button':
                      self.buttons.append(d)

          p=Parser(); p.feed(text)
          assert len(p.ids) == len(set(p.ids)), 'duplicate ids found'
          required = {
              'view-overview','view-develop','view-change','view-knowledge',
              'view-conditions','view-evidence','interfaceToggle','interfaceStatus'
          }
          missing = required - set(p.ids)
          assert not missing, f'missing required ids: {sorted(missing)}'
          for marker in [
              'generated-board visual sophistication + V21 semantic discipline',
              'Illustrative structure. No production or approval status is implied.',
              'Scenario controls only. They do not report current SEB readiness.',
              'V22 visual prototype · not production status or factual authority'
          ]:
              assert marker in text, f'missing semantic safety marker: {marker}'
          assert 'https://' not in text and 'http://' not in text, 'prototype must remain dependency-free'
          assert '<script>' in text and '</script>' in text
          print(f'HTML parsed; {len(p.ids)} ids; {len(p.buttons)} buttons')
          PY

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Browser smoke and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v22-site artifacts/v22
          cp prototypes/v22-visual-ambition/index.html /tmp/v22-site/index.html
          python -m http.server 4173 --directory /tmp/v22-site >/tmp/v22-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          CHROME=$(command -v chromium-browser || command -v chromium)
          for view in overview develop change knowledge conditions evidence; do
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size=1440,1100 \
              --screenshot="artifacts/v22/${view}-desktop.png" \
              "http://127.0.0.1:4173/#${view}"
          done

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --screenshot="artifacts/v22/overview-mobile.png" \
            "http://127.0.0.1:4173/#overview"

          python - <<'PY'
          from pathlib import Path
          shots=list(Path('artifacts/v22').glob('*.png'))
          assert len(shots)==7, f'expected 7 screenshots, found {len(shots)}'
          assert all(p.stat().st_size > 10_000 for p in shots), 'one or more screenshots look empty'
          print('screenshots:', ', '.join(p.name for p in shots))
          PY

      - name: Upload rendered prototype
        uses: actions/upload-artifact@v4
        with:
          name: v22-visual-ambition-renders
          path: artifacts/v22
          retention-days: 30
