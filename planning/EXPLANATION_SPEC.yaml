terminology:
  concepts:
  - concept_id: work
    preferred_label: CLM work
    alternate_labels:
    - CLM task
    type: activity
    definition: A bounded analysis, development, change or preparation task with a purpose, inputs and responsible
      role.
    current_or_target: both
    scope_note: Reported current work; instances have their own status
  - concept_id: colleague
    preferred_label: Responsible colleague
    type: actor
    definition: Accountable person/role for task direction, review or a relevant decision; actual appointment is
      not inferred.
    current_or_target: both
  - concept_id: ai-assistance
    preferred_label: AI assistance
    type: capability
    definition: Bounded support using actual permitted inputs and tools; not autonomous institutional authority.
    current_or_target: both
  - concept_id: output
    preferred_label: Task output
    type: object
    definition: Result prepared for the current task, with its source and scope retained.
    domain_kind: artifact
    current_or_target: both
  - concept_id: task-review
    preferred_label: Review for this task
    type: activity
    definition: Checks whether the result is suitable for the current purpose; distinct from approval for reuse.
    current_or_target: both
  - concept_id: artifact
    preferred_label: Candidate reusable artifact
    type: object
    definition: Selected instruction, context, requirement, mapping, method or evidence from work; candidate does
      not imply approval.
    domain_kind: artifact
    current_or_target: both
  - concept_id: reuse-review
    preferred_label: Review for reuse
    type: activity
    definition: Examines meaning, applicability, source/version, ownership, maintenance and permitted consumption
      for another task.
    current_or_target: both
  - concept_id: reuse-scope
    preferred_label: Scope of reuse
    type: constraint
    definition: Recorded boundaries within which an artifact may inform another task; does not grant access or action
      permissions.
    domain_kind: condition
    current_or_target: both
  - concept_id: other-work
    preferred_label: Another CLM task
    type: activity
    definition: A distinct purpose for which the artifact's applicability must be established.
    current_or_target: both
  - concept_id: rules
    preferred_label: Rules and instructions
    type: concept
    definition: What applies and why; law, internal interpretation, policy and instruction remain different authority
      classes.
    domain_kind: knowledge
    current_or_target: both
  - concept_id: context
    preferred_label: CLM and FenX context
    type: concept
    definition: Process/system/field meaning and relevant facts, with their different origins and freshness explicit.
    domain_kind: knowledge
    current_or_target: both
  - concept_id: operational-facts
    preferred_label: Operational information
    type: object
    definition: Current case/system information from an actually permitted route; not knowledge about the system.
    domain_kind: data
    current_or_target: both
  - concept_id: requirement
    preferred_label: Requirement
    type: object
    definition: Expected behaviour linked to its applicable input and acceptance logic; authority and review state
      explicit.
    domain_kind: artifact
    current_or_target: both
  - concept_id: implementation
    preferred_label: Implemented behaviour
    type: state
    definition: What a delivered solution actually does; not inferred from a requirement or demonstration.
    domain_kind: system_behaviour
    current_or_target: both
  - concept_id: test
    preferred_label: Test
    type: concept
    definition: Checks defined behaviour for a particular version, input and scope; test does not grant approval.
    domain_kind: method
    current_or_target: both
  - concept_id: evidence
    preferred_label: Recorded evidence
    type: object
    definition: Observation/result with version, time, scope and limitations; old evidence is not silently rebound
      to a new requirement.
    domain_kind: artifact
    current_or_target: both
  - concept_id: operating-plane
    preferred_label: Requirements and evidence
    alternate_labels:
    - Operating plane
    type: concept
    definition: Implementation, controls, mappings, tests, evidence and ownership; not GCP or a vendor platform.
    domain_kind: conceptual_group
    current_or_target: both
  - concept_id: method
    preferred_label: Method
    type: concept
    definition: How to perform a bounded task; a document is not automatically an installed executable skill.
    domain_kind: knowledge
    current_or_target: both
  - concept_id: tool
    preferred_label: Tool
    type: capability
    definition: A capability invoked in the task, distinct from the knowledge that informs it.
    current_or_target: both
  - concept_id: harness
    preferred_label: Harness
    type: object
    definition: Coordinates and constrains execution, context and tool use within the actual environment.
    domain_kind: execution_component
    current_or_target: both
  - concept_id: runtime
    preferred_label: Runtime
    type: object
    definition: Actual environment where assistance executes; a scenario choice does not provision it.
    domain_kind: execution_environment
    current_or_target: both
  - concept_id: interface
    preferred_label: Permitted information route
    alternate_labels:
    - Data interface
    type: interface
    definition: An actual permitted means to obtain the needed information with defined scope; an environment alone
      does not create it.
    current_or_target: both
  - concept_id: data-product
    preferred_label: Data product
    type: capability
    definition: A maintained package of data for a defined purpose, with clear meaning, owner, quality/freshness
      expectations and a permitted way to use it.
    domain_kind: maintained_data_capability
    current_or_target: both
  - concept_id: service
    preferred_label: Shared assistant/service
    type: capability
    definition: Assistance intended for colleagues through an actual release/support route; requires task-specific
      conditions and ownership.
    domain_kind: operated_capability
    current_or_target: both
  - concept_id: controls
    preferred_label: Applicable controls
    type: constraint
    definition: Relevant access, privacy, authority, evaluation, risk, release, monitoring, recovery and responsibility
      requirements; not one interchangeable tier.
    domain_kind: condition
    current_or_target: both
  - concept_id: permission
    preferred_label: Permitted action
    type: constraint
    definition: Actual authority/access to perform a defined action; missing mandatory permission stops that action.
    domain_kind: condition
    current_or_target: both
  - concept_id: feedback
    preferred_label: Observed feedback
    type: evidence
    definition: Input to evaluation or a review candidate, not an authoritative knowledge update.
    domain_kind: observation
    current_or_target: both
  - concept_id: change-candidate
    preferred_label: Review candidate
    type: object
    definition: Proposed correction or improvement retaining source and rationale for a responsible review.
    domain_kind: artifact
    current_or_target: both
  - concept_id: authoritative-record
    preferred_label: Authoritative customer record
    alternate_labels:
    - Golden fields
    type: object
    definition: Customer record maintained through the applicable authorised process; outside AI inference/feedback
      authority, not necessarily physically separate.
    domain_kind: authority_boundary
    current_or_target: both
  scope_collisions:
  - Delivery status, artifact authority, reuse review and evidence strength are distinct.
  - Scenario assumption is not permission.
  - Knowledge about FenX, retrieved case facts and a maintained data product are distinct.
epistemic_register:
- claim_id: C_STRATEGY
  statement: The supplied strategy supports governed machine-readable knowledge, AI-assisted development, shared
    capabilities and local lifecycle ownership. Its horizons run concurrently.
  status: fact
  source_refs:
  - S_STRATEGY
  confidence: high
  current_or_target: both
  caveat: Strategic alignment is not permission, deployment or measured benefit.
  evidence_kind: source_fact
  confidence_scope: High as a reading of the supplied version; no assertion of current currency or local maturity
  state_note: Document direction spans current work and target ambitions
- claim_id: C_WORK_REPORT
  statement: Ludwig reports using FenX, SOP/policy and other knowledge artifacts as context for Kaicy-related work
    and AI-assisted development/change work.
  status: observed_evidence
  source_refs:
  - S_USER
  current_or_target: both
  caveat: Not independently measured performance or live system integration.
  evidence_kind: user_report
  state_note: current_reported
- claim_id: C_REUSE
  statement: Selected artifacts can inform another task when meaning, applicability, ownership, maintenance and
    permitted consumption are established.
  status: working_interpretation
  source_refs:
  - S_USER
  - S_OPERATING
  - S_INTEL
  current_or_target: both
  caveat: Possibility, not automatic transfer, savings or approval.
  state_note: proposed_scoped_mechanism
- claim_id: C_REVIEWS
  statement: Suitability of an output for this task and suitability of an artifact for reuse are separate review
    questions.
  status: authoritative_requirement
  source_refs:
  - S_USER
  - S_METHOD
  - S_INTEL
  current_or_target: target
  caveat: Two distinctions are not an exhaustive governance gate list.
  evidence_kind: adopted_design_requirement
  state_note: target_explanation
- claim_id: C_CONDITIONS
  statement: Conditions affect the reach of a named task; they are not a universal gate on all useful AI work.
  status: working_interpretation
  source_refs:
  - S_STRATEGY
  - S_USER
  - S_INTEL
  derived_from:
  - CF_NO_INTERFACE
  - CF_DETERMINISTIC
  current_or_target: both
  caveat: Mandatory permissions remain hard constraints for the relevant action.
  evidence_kind: reasoned_design_requirement
  state_note: target_explanation
