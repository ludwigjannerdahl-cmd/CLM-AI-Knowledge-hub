selected_architecture:
  explanatory_spine: Useful work produces outputs; selected artifacts may inform further work after scoped review;
    actual information and operating arrangements determine extension.
  governing_thesis: AI can assist CLM work and reviewed context can support another task under established conditions;
    human accountability and evidence boundaries remain visible.
  key_distinctions:
  - Task acceptance / reuse review
  - Knowledge / operational facts / data product
  - Method / tool / harness / runtime
  - Preparation / assessment / approval
  - Authority / delivery status / evidence scope
  - Access / operation / permission
  preserved_properties:
  - Work/output relationships
  - Human authority
  - Source/version
  - Conditional applicability
  - Original useful depth
  - Reliable context return
  deliberate_distortions:
  - Few specimens represent richer maintained records
  - Opening suppresses detailed topology and the full portfolio
  - Artifact grouping is explanatory rather than a deployment/storage claim
  limitations:
  - No verified current enterprise integration
  - Synthetic examples cannot establish benefit or legal compliance
  - Proposed composition is not reader-validated
  - The source draft and schemas are inspected; no view is rendered or reader-validated.
  alternative_interpretations_retained:
  - Some artifacts are not reusable
  - Supplied-input work may be sufficient
  - A deterministic solution may be preferable
  - Different tasks may need different permitted runtime lanes
memory_architecture:
  memory_handles:
  - Review defines the scope of reuse
  - An environment does not create an interface
  - Feedback creates a review candidate
  reusable_questions:
  - What is the task and output?
  - What context applies?
  - Who checks and decides?
  - What condition is missing?
  - What does the evidence actually cover?
  analogy:
    selected: false
    verdict: Literal specimens preferred; no compulsory house, brain or flywheel metaphor.
