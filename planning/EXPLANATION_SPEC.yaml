argument_models:
- argument_id: A_INTEGRATE
  claim: Build the explanation into the existing Hub, with canonical topic blocks projected in relevant contexts.
  claim_ref: C_INTEGRATION
  grounds_refs:
  - S_USER
  - S_HUB
  - S_UI
  warrant: The reader's difficulty is reconnecting distributed meaning; relocating all depth into an archive retains
    that reconstruction burden.
  qualifier: Canonical projection is a design proposal; actual content mapping and reader performance must be tested.
  rebuttals:
  - Some long sources warrant a dedicated native reading route.
  - Some obsolete material should be revised or qualified rather than placed in the opening.
  falsification_conditions:
  - Readers still cannot locate relevant depth or preserve context.
  - Canonical blocks remove necessary source nuance or useful behaviours.
- argument_id: A_BOUNDED_EVAL
  claim: A bounded reuse evaluation is a reasonable next decision candidate when the context and owner are known.
  claim_ref: C_REUSE
  grounds_refs:
  - S_USER
  - S_STRATEGY
  - S_OPERATING
  - S_EVALUATION
  warrant: Testing applicability in one defined task can expose the missing context, review burden and conditions
    before wider commitments.
  qualifier: An option, not an approved programme or the Hub's mandatory purpose.
  rebuttals:
  - A critical unavailable source or owner may need resolving first.
  - A deterministic solution or supplied-input method may fit better than a shared assistant.
  falsification_conditions:
  - No permitted representative inputs or accountable review route.
  - Reused context is unsuitable or its maintenance burden defeats the intended purpose.
decision_spaces:
- decision_id: D_NEXT
  question: Which bounded task or missing condition should be examined next?
  owner: Actual CLM/task owner to establish
  deadline_or_trigger: After understanding the relationship and inspecting the selected task's gaps; no invented
    deadline
  alternatives:
  - Evaluate reviewed context on a supplied-input task
  - Verify a necessary information route
  - Improve a deterministic development artifact
  - Defer reuse because scope/ownership is unresolved
  criteria:
  - Useful defined output
  - Permitted inputs and actions
  - Accountable review
  - Observable quality and review/maintenance effort
  - Proportionate commitment
  reversibility: partly_reversible
  evidence_threshold: Enough source/context to frame and review the test; real release needs its separate controls
  unresolved:
  - U_DOMAIN
  - U_LIVE
  - U_PORTFOLIO
  reversibility_note: Prefer a bounded reversible evaluation where feasible; no operational action in this Hub
misconception_register:
- misconception_id: M_REUSE
  belief: Accepted output is automatically reusable truth
  where_it_breaks: Purpose, version, permission and applicability differ
  replacement_model: Task acceptance and reuse review are distinct
  decision_risk_if_retained: Out-of-scope use or false authority
- misconception_id: M_ENV
  belief: A suitable platform provides the needed data and a reliable assistant
  where_it_breaks: Interface and service operation are separate conditions
  replacement_model: Compare actual information and operating routes for the task
  decision_risk_if_retained: Unfounded deployment commitment
- misconception_id: M_LOOP
  belief: Feedback always improves knowledge and customer records
  where_it_breaks: Feedback may be wrong or out of scope and needs review
  replacement_model: Feedback creates a candidate; authoritative promotion has a separate route
  decision_risk_if_retained: Uncontrolled authority promotion
- misconception_id: M_AI_RUNTIME
  belief: Every AI-assisted delivery needs a production AI runtime
  where_it_breaks: The delivered feature can be deterministic
  replacement_model: Evaluate the actual solution separately from development assistance
  decision_risk_if_retained: Unnecessary platform dependence
